services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lims-app
    container_name: lims-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - lims-network

  web:
    image: nginx:alpine
    container_name: lims-web
    restart: unless-stopped
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - lims-network
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: lims-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lims_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-lims_user}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - lims-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lims-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://lim-system.my/phpmyadmin/
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - lims-network
    depends_on:
      - db

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lims-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www
    networks:
      - lims-network
    depends_on:
      - app
      - db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lims-scheduler
    restart: unless-stopped
    command: bash -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www
    networks:
      - lims-network
    depends_on:
      - app
      - db

networks:
  lims-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
